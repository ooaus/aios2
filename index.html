<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>跳转中...</title>
    <script>
        // 目标跳转地址
        const targetUrl = "https://ddaa.online";

        function goJump() {
            try {
                window.location.href = targetUrl;
            } catch (e) {
                // 跳转出错自动刷新重试
                location.reload();
            }
        }

        // 页面加载立刻跳转
        window.onload = goJump;
    </script>
</head>
<body>
    正在跳转中，请勿关闭页面...
</body>
</html>
